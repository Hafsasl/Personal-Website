<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hafsa | Creative Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>

    * {margin: 0; padding: 0; box-sizing: border-box;}
    
    :root {
      --primary: #00f5ff;
      --secondary: #ff006e;
      --accent: #8338ec;
      --dark: #0a0e27;
      --light: #f0f4f8;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--dark);
      color: var(--light);
      overflow-x: hidden;
      position: relative;
    }



    /* --- 3D Viewer Section Styling --- */
    #interactive-3d {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 80px 40px;
      margin-top: 80px;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .model-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      overflow: hidden;
      padding-bottom: 20px;
      transition: 0.3s;
    }

    .model-viewer {
      width: 100%;
      height: 300px;
      background: #0a0e27;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 2rem;
    }

    .load-model-btn {
      margin: 20px auto 0;
      display: block;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .load-model-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <!--      3D VIEWER SECTION       -->
  <section id="interactive-3d" class="fade-in">
    <h2 class="heading">Interactive <span>3D Models</span></h2>
    <p class="section-subtitle">Explore my Blender work in real-time</p>

    <div class="models-grid">

      <div class="model-card">
        <div class="model-viewer" id="viewer1">University 2050</div>
        <button class="load-model-btn" onclick="loadModel1()">Load Model</button>
      </div>

      <div class="model-card">
        <div class="model-viewer" id="viewer2">Dining Room</div>
        <button class="load-model-btn" onclick="loadModel2()">Load Model</button>
      </div>

      <div class="model-card">
        <div class="model-viewer" id="viewer3">Drone</div>
        <button class="load-model-btn" onclick="loadModel3()">Load Model</button>
      </div>

    </div>
  </section>

  <!-- CONTACT + FOOTER  -->
  <section id="contact" class="fade-in">
    <h2 class="section-title">Let's Connect</h2>
    <p class="section-subtitle">I'd love to hear from you!</p>
    <div class="contact-content">
      <div class="contact-info">
        <div class="contact-item">
          <span class="contact-icon">📧</span>
          <div>
            <h4>Email</h4>
            <a href="mailto:hafssaslim@gmail.com">hafssaslim@gmail.com</a>
          </div>
        </div>
        <div class="contact-item">
          <span class="contact-icon">💻</span>
          <div>
            <h4>GitHub</h4>
            <a href="https://github.com/Hafsasl" target="_blank">github.com/Hafsasl</a>
          </div>
        </div>
      </div>
    </div>
  </section>
  
  <footer>
    <p>&copy; 2025 Hafsa. Crafted with passion and code.</p>
    <p>Designed to inspire • Built to impress</p>
  </footer>
  <script>
    // Smooth scrolling for internal links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if(target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });

    // Scroll animations using IntersectionObserver
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -100px 0px'
    };
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Dynamic background orbs
    document.addEventListener('mousemove', (e) => {
      const orbs = document.querySelectorAll('.orb');
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      orbs.forEach((orb, index) => {
        const speed = (index + 1) * 20;
        orb.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
      });
    });
  </script>

 
  <!--   THREE.JS + GLTF LOADER  -->
  <!-- Using r128 to match examples loader URLs used earlier -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Keep renderers, scenes, cameras etc per viewer id
    const VIEWERS = {};

    // Create a viewer instance for a container id and glb filename
    function initViewer(viewerId, glbFilename, btn) {
      const container = document.getElementById(viewerId);
      if(!container) {
        console.error('Container not found:', viewerId);
        return;
      }

      // If already initialized, avoid re-init
      if (VIEWERS[viewerId] && VIEWERS[viewerId].initialized) return;

      const width = container.clientWidth || 400;
      const height = container.clientHeight || 300;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0e27);

      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(3, 2.5, 4);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.innerHTML = ""; // clear placeholder text
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.autoRotate = false;

      // Lights
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(5, 10, 7);
      scene.add(dir);
      const point1 = new THREE.PointLight(0x00f5ff, 0.2);
      point1.position.set(-5, 5, -5);
      scene.add(point1);
      const point2 = new THREE.PointLight(0xff006e, 0.2);
      point2.position.set(5, 5, 5);
      scene.add(point2);

      // Ground / subtle grid (optional)
      const grid = new THREE.GridHelper(8, 8, 0x111122, 0x111122);
      grid.material.opacity = 0.06;
      grid.material.transparent = true;
      scene.add(grid);

      // store in VIEWERS
      VIEWERS[viewerId] = {
        container, scene, camera, renderer, controls,
        model: null, initialized: true, filename: glbFilename
      };

      // load model
      loadModelToViewer(viewerId, glbFilename, btn);

      // animate loop for this viewer
      function animate() {
        if(!VIEWERS[viewerId]) return; // stopped
        requestAnimationFrame(animate);
        VIEWERS[viewerId].controls.update();
        // small auto-rotate for model if loaded
        if (VIEWERS[viewerId].model) {
          VIEWERS[viewerId].model.rotation.y += 0.003;
        }
        VIEWERS[viewerId].renderer.render(VIEWERS[viewerId].scene, VIEWERS[viewerId].camera);
      }
      animate();

      // resize handling for this viewer
      function onResize() {
        const w = container.clientWidth || 300;
        const h = container.clientHeight || 300;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      // attach resize observer to update when container changes size
      const ro = new ResizeObserver(onResize);
      ro.observe(container);
      VIEWERS[viewerId].resizeObserver = ro;
    }

    // load glb into a viewer (filename can be "university.glb" if same folder)
    function loadModelToViewer(viewerId, filename, btn) {
      const V = VIEWERS[viewerId];
      const loader = new THREE.GLTFLoader();
      const button = btn || (() => {
        // fallback: try find the button next to the container
        const container = document.getElementById(viewerId);
        return container ? container.parentElement.querySelector('.load-model-btn') : null;
      })();

      if (button) {
        button.disabled = true;
        button.textContent = '⏳ Loading...';
      }

      // If viewer not init yet, init first (initViewer will call loadModel again)
      if (!V) {
        initViewer(viewerId, filename, button);
        return;
      }

      // remove old model if exists
      if (V.model) {
        try { V.scene.remove(V.model); } catch(e){/*ignore*/ }
        V.model = null;
      }

      // Start loading
      loader.load(
        filename,
        function(gltf) {
          const model = gltf.scene || gltf.scenes[0];
          // compute bounding box and center/scale
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          // Guard against zero-size models
          const maxDim = Math.max(size.x, size.y, size.z);
          let scale = 1;
          if (maxDim > 0) {
            scale = 1.8 / maxDim; // fit nicely into the viewer
          }

          model.position.x -= center.x;
          model.position.y -= center.y;
          model.position.z -= center.z;
          model.scale.setScalar(scale);

          // optional: cast shadows if desired (requires renderer and lights enabling)
          model.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = true;
              node.receiveShadow = true;
            }
          });

          V.scene.add(model);
          V.model = model;

          if (button) {
            button.textContent = '✅ Loaded';
            button.style.background = 'linear-gradient(135deg, #00ff88, #00ccff)';
          }
        },
        // progress
        function(xhr) {
          if (!xhr.lengthComputable) return;
          const percent = Math.round(xhr.loaded / xhr.total * 100);
          if (button) button.textContent = `⏳ ${percent}%`;
        },
        // error
        function(err) {
          console.error('GLTF load error:', err);
          if (button) {
            button.textContent = '❌ Error';
            button.disabled = false;
            alert('Error loading 3D model. Make sure the .glb file is in the same folder and spelled exactly as the filename used.');
          }
        }
      );
    }

    // Simple wrapper functions used by the buttons (filenames are local - same folder as index.html)
    function loadModel1() {
      const btn = document.querySelector('#viewer1').parentElement.querySelector('.load-model-btn');
      initViewer('viewer1', 'university.glb', btn); // will call load automatically
    }
    function loadModel2() {
      const btn = document.querySelector('#viewer2').parentElement.querySelector('.load-model-btn');
      initViewer('viewer2', 'diningroom.glb', btn);
    }
    function loadModel3() {
      const btn = document.querySelector('#viewer3').parentElement.querySelector('.load-model-btn');
      initViewer('viewer3', 'drone.glb', btn);
    }

    // Global resize listener to update all renderers' pixel ratio on window change
    window.addEventListener('resize', () => {
      Object.values(VIEWERS).forEach(v => {
        if (!v || !v.renderer || !v.container) return;
        const w = v.container.clientWidth || 300;
        const h = v.container.clientHeight || 300;
        v.camera.aspect = w / h;
        v.camera.updateProjectionMatrix();
        v.renderer.setSize(w, h);
        v.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    });
  </script>
</body>
</html>
